    <style>

        font-weight: 700;
        color: #fff;
      }
      .inote-sub {
        margin-top: 4px;
        font-size: 11.5px;
        color: #6f6f7a;
      }
      .switch {
        position: relative;
        width: 44px;
        height: 24px;
        display: inline-block;
      }
      .switch input {
        display: none;
      }
      .switch span {
        position: absolute;
        inset: 0;
        background: #333;
        border-radius: 999px;
        transition: 0.2s;
        cursor: pointer;
      }
      .switch span:before {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        left: 3px;
        top: 3px;
        background: #fff;
        border-radius: 50%;
        transition: 0.2s;
      }
      .switch input:checked + span {
        background: var(--accent);
      }
      .switch input:checked + span:before {
        transform: translateX(20px);
      }
      footer {
        text-align: center;
        font-size: 11px;
        color: #6a6a6a;
        padding: 14px;
        background: linear-gradient(180deg, #141414 0%, #0a0a0a 100%);
        position: sticky;
        bottom: 0;
        border-top: 1px solid #2a2a2a;
        box-shadow: 0 -2px 18px rgba(0, 0, 0, 0.6);
      }
      footer a {
        color: var(--accent);
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }
    </style>
