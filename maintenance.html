<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AuditionMusic5 — Maintenance</title>
<link rel="icon" href="image/favicon.ico" />
<link rel="apple-touch-icon-precomposed" sizes="57x57" href="image/apple-touch-icon-57x57.png" />
<link rel="apple-touch-icon-precomposed" sizes="60x60" href="image/apple-touch-icon-60x60.png" />
<link rel="apple-touch-icon-precomposed" sizes="72x72" href="image/apple-touch-icon-72x72.png" />
<link rel="apple-touch-icon-precomposed" sizes="76x76" href="image/apple-touch-icon-76x76.png" />
<link rel="apple-touch-icon-precomposed" sizes="114x114" href="image/apple-touch-icon-114x114.png" />
<link rel="apple-touch-icon-precomposed" sizes="120x120" href="image/apple-touch-icon-120x120.png" />
<link rel="apple-touch-icon-precomposed" sizes="144x144" href="image/apple-touch-icon-144x144.png" />
<link rel="apple-touch-icon-precomposed" sizes="152x152" href="image/apple-touch-icon-152x152.png" />
<link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon-180x180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
  :root { --accent:#a238ff; --bg:#0e0e14; --panel:#171722; --text:#e8e8f0; --muted:#9a9aae; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body {
    background:radial-gradient(1200px 600px at 50% -10%, #241040 0%, var(--bg) 60%);
    color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;
  }
  .card { max-width:520px; width:100%; }
  .ico { font-size:56px; line-height:1; }
  h1 { font-size:1.7rem; margin:18px 0 6px; letter-spacing:.3px; }
  h1 span { color:var(--accent); }
  p { color:var(--muted); line-height:1.6; margin:8px 0; }
  .bar {
    height:6px; border-radius:3px; margin:26px auto 0; max-width:280px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    background-size:200% 100%; animation:sw 1.4s linear infinite;
  }
  @keyframes sw { from { background-position:200% 0; } to { background-position:-200% 0; } }
  .ver { margin-top:22px; font-size:.8rem; color:#6a6a6a; }
  .ver a { color:var(--accent); text-decoration:none; }
  .ver a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <main class="card">
    <div class="ico">🛠️</div>
    <h1>Audition<span>Music5</span></h1>
    <p><strong>We&rsquo;re doing maintenance.</strong></p>
    <p>AuditionMusic5 is temporarily offline while we update the servers.<br>
       Please check back in a little while.</p>
    <div class="bar"></div>
    <div class="ver">&copy; <span id="yr"></span> AuditionMusic5 &bull; Made by <a href="https://www.facebook.com/raiszhe" target="_blank">mello</a></div>
  </main>
  <script src="js/guard.js?v=715"></script>
<script src="js/tip.js?v=715"></script>
  <script>document.getElementById("yr").textContent = new Date().getFullYear();</script>
</body>
</html>
