<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign up &mdash; AuditionMusic5</title>
<link rel="icon" href="image/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon-180x180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
  :root { --accent:#a238ff; --bg:#000; --panel:#1a1a1a; --text:#fff; --muted:#a7a7a7; --rail:#2a2a2a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; }
  header { padding:16px 22px; border-bottom:1px solid var(--rail); }
  header h1 { margin:0; font-size:18px; font-weight:800; }
  header h1 span { color:var(--accent); }
  header h1 a { color:inherit; text-decoration:none; }
  .wrap { max-width:420px; margin:0 auto; padding:40px 22px 80px; }
  h2 { text-align:center; font-size:40px; font-weight:800; margin:0 0 30px; letter-spacing:-1px; }
  label { display:block; font-size:13px; color:var(--muted); margin:0 0 6px; }
  input[type=text], input[type=email], input[type=password] {
    width:100%; padding:14px; margin-bottom:18px; background:var(--panel); color:#fff;
    border:1px solid var(--rail); border-radius:8px; font-size:16px; outline:none; }
  input:focus { border-color:var(--accent); }
  .otprow { display:flex; gap:8px; }
  .otprow input { margin-bottom:18px; }
  .otpbtn { flex:0 0 auto; height:50px; padding:0 14px; border:1px solid var(--accent); border-radius:8px;
    background:transparent; color:var(--accent); font:inherit; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .otpbtn:hover { background:rgba(162,56,255,.12); }
  .otpbtn:disabled { border-color:var(--rail); color:var(--muted); cursor:default; background:transparent; }
  .btn { width:100%; padding:14px; background:var(--accent); color:#fff; border:0; border-radius:8px;
    font-size:15px; font-weight:700; cursor:pointer; }
  .btn:hover { filter:brightness(1.1); }
  .btn:disabled { filter:saturate(.5) brightness(.8); cursor:default; }
  .cf { margin:0 0 18px; min-height:65px; }
  .msg { min-height:18px; margin:10px 0 0; font-size:13px; text-align:center; color:#ff6b6b; }
  .msg.ok { color:#6ee7a8; }
  .alt { display:block; text-align:center; margin-top:18px; color:var(--muted); font-size:13px; text-decoration:none; }
  .alt a { color:var(--accent); font-weight:700; text-decoration:none; }
  .alt a:hover { text-decoration:underline; }
  @media (max-width:420px) { h2 { font-size:34px; } }
</style>
</head>
<body>
<header><h1><a href="/">Audition<span>Music5</span></a></h1></header>
<main class="wrap">
  <h2>Sign up</h2>
  <form id="f" novalidate>
    <label for="u">Username</label>
    <input type="text" id="u" autocomplete="username" maxlength="32" required>
    <label for="e">Email</label>
    <div class="otprow">
      <input type="email" id="e" autocomplete="email" maxlength="254" required>
      <button class="otpbtn" type="button" id="otpbtn">Get OTP</button>
    </div>
    <label for="o">OTP</label>
    <input type="text" id="o" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
    <label for="p">Password</label>
    <input type="password" id="p" autocomplete="new-password" minlength="6" required>
    <!-- turnstile -->
    <div class="cf cf-turnstile" data-sitekey="0x4AAAAAAFi1HvDgsFLNHXGT" data-theme="dark"></div>
    <button class="btn" type="submit" id="createbtn">Create Account</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="alt">Already have an account? <a href="/login.aspx">Log in</a></div>
  <a class="alt" href="/">&larr; Back to AuditionMusic5</a>
</main>
<script src="js/guard.js?v=726"></script>
<script src="js/tip.js?v=726"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
  const $ = (id) => document.getElementById(id);
  const msg = (t, ok) => { $("msg").textContent = t || ""; $("msg").className = "msg" + (ok ? " ok" : ""); };
  const token = () => (window.turnstile && document.querySelector(".cf-turnstile") && window.turnstile.getResponse()) || "";
  let waitTimer = 0;

  function countdown(sec) {
    const b = $("otpbtn");
    clearInterval(waitTimer);
    let n = sec;
    b.disabled = true;
    b.textContent = "Wait " + n + "s";
    waitTimer = setInterval(() => {
      n--;
      if (n <= 0) {
        clearInterval(waitTimer);
        b.disabled = false;
        b.textContent = "Get OTP";
      } else b.textContent = "Wait " + n + "s";
    }, 1000);
  }

  $("otpbtn").addEventListener("click", async () => {
    msg("");
    const u = $("u").value.trim();
    const email = $("e").value.trim();
    if (!u) return msg("Username is required.");
    if (!email) return msg("Email is required.");
    if (!token()) return msg("Complete the verification first.");
    $("otpbtn").disabled = true;
    try {
      const r = await fetch("/api/auth/signup/otp", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ u, email, token: token() }),
      });
      const j = await r.json();
      if (j.ok) {
        msg("Code sent. Check your inbox.", true);
        countdown(j.wait || 60);
        if (window.turnstile) window.turnstile.reset();
      } else {
        msg(j.error || "Could not send code.");
        $("otpbtn").disabled = false;
        if (window.turnstile) window.turnstile.reset();
      }
    } catch (e) {
      msg("Could not send code. Try again.");
      $("otpbtn").disabled = false;
    }
  });

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    msg("");
    const u = $("u").value.trim();
    const email = $("e").value.trim();
    const otp = $("o").value.replace(/\D/g, "");
    const p = $("p").value;
    if (!u || !email || !otp || !p) return msg("Fill all fields.");
    if (otp.length !== 6) return msg("OTP must be 6 digits.");
    if (p.length < 6) return msg("Password must be at least 6 characters.");
    $("createbtn").disabled = true;
    try {
      const r = await fetch("/api/auth/signup", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ u, email, otp, p }),
      });
      const j = await r.json();
      if (j.ok) { location.href = "/"; return; }
      msg(j.error === "maintenance" ? "Site is under maintenance." : (j.error || "Sign up failed."));
    } catch (err) {
      msg("Sign up failed. Try again.");
    }
    $("createbtn").disabled = false;
    if (window.turnstile) window.turnstile.reset();
  });
</script>
</body>
</html>
