<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign up - AuditionMusic5</title>
<link rel="icon" href="image/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon-180x180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
  :root { --accent:#a238ff; --bg:#000; --panel:#1a1a1a; --text:#fff; --muted:#a7a7a7; --rail:#2a2a2a; }
  * { box-sizing: border-box; }
  a { text-decoration: none; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; }
  header { padding:16px 22px; border-bottom:1px solid var(--rail); }
  header h1 { margin:0; font-size:18px; font-weight:800; }
  header h1 span { color:var(--accent); }
  header h1 a { color:inherit; text-decoration:none; }
  .wrap { max-width:420px; margin:0 auto; padding:40px 22px 80px; }
  h2 { text-align:center; font-size:40px; font-weight:800; margin:0 0 30px; letter-spacing:-1px; }
  label { display:block; font-size:13px; color:var(--muted); margin:0 0 6px; }
  input[type=text], input[type=email], input[type=password] {
    width:100%; height:48px; padding:0 14px; margin-bottom:18px; background:var(--panel); color:#fff;
    border:1px solid var(--rail); border-radius:8px; font-size:16px; outline:none; }
  input:focus { border-color:var(--accent); }
  .otprow { display:flex; gap:8px; }
  .otprow input { margin-bottom:18px; }
  .otpbtn { flex:0 0 auto; width:86px; min-width:86px; height:48px; padding:0; border:1px solid var(--accent); border-radius:8px;
    background:var(--accent); color:#fff; font:inherit; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .otpbtn:hover:not(:disabled) { filter:brightness(1.1); }
  .otpbtn:disabled { background:var(--accent); border-color:var(--accent); color:#fff; opacity:.55; cursor:default; }
  .otpbtn.loading { opacity:1; background:#3a3a3a; border-color:#444; color:#d0d0d0; }
  .btn { width:100%; height:48px; padding:0 14px; background:var(--accent); color:#fff; border:0; border-radius:8px;
    font-size:15px; font-weight:700; cursor:pointer; }
  .btn:hover { filter:brightness(1.1); }
  .btn:disabled { filter:saturate(.5) brightness(.8); cursor:default; }
  .btn.loading, .otpbtn.loading { display:flex; align-items:center; justify-content:center; gap:7px; }
  .spin { width:13px; height:13px; flex:0 0 auto; border:2px solid currentColor; border-right-color:transparent;
    border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration:1.4s; } }
  .cf { width:100%; margin:0 0 18px; min-height:65px; }
  .or { text-align:center; color:var(--muted); margin:18px 0; font-size:14px; }
  .goog { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; height:48px; padding:0 14px; font-family:inherit;
    background:#fff; color:#1f1f1f; border:0; border-radius:8px; font-size:15px; font-weight:700;
    cursor:pointer; text-decoration:none; }
  .goog:hover { filter:brightness(.95); }
  .goog svg { width:20px; height:20px; flex:0 0 auto; }
  .terms { margin:10px 0 0; font-size:12px; line-height:1.5; text-align:center; color:var(--muted); }
  .terms a { color:var(--accent); }
  .msg { min-height:18px; margin:0 0 12px; font-size:13px; text-align:center; color:#ff6b6b; }
  .msg.ok { color:#6ee7a8; }
  .alt { display:block; text-align:center; margin-top:14px; color:var(--muted); font-size:13px; text-decoration:none; }
  .alt a { color:var(--accent); font-weight:700; text-decoration:none; }
  .alt a:hover { text-decoration: none; }
  @media (max-width:420px) { h2 { font-size:34px; } }
</style>
</head>
<body>
<header><h1><a href="/">Audition<span>Music5</span></a></h1></header>
<main class="wrap">
  <h2>Sign up</h2>
  <div class="msg" id="msg"></div>
  <form id="f" novalidate>
    <label for="u">Username</label>
    <input type="text" id="u" autocomplete="username" maxlength="32" required>
    <label for="e">Email</label>
    <div class="otprow">
      <input type="email" id="e" autocomplete="email" maxlength="254" required>
      <button class="otpbtn" type="button" id="otpbtn">Get Code</button>
    </div>
    <label for="o">Verification Code</label>
    <input type="text" id="o" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
    <label for="p">Password</label>
    <input type="password" id="p" autocomplete="new-password" minlength="6" required>
    <!-- turnstile -->
    <div class="cf cf-turnstile" data-sitekey="0x4AAAAAAFi1HvDgsFLNHXGT" data-theme="dark" data-size="flexible"></div>
    <button class="btn" type="submit" id="createbtn">Sign up for free</button>
    <p class="terms">By using <a href="/">AuditionMusic5</a>, you agree to the <a href="/terms.aspx" target="_blank" rel="noopener">Terms of Service</a>.</p>
  </form>
  <div class="or">or</div>
  <button class="goog" type="button" id="gbtn">
    <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Continue with Gmail
  </button>
  <div class="alt">Already have an account? <a href="/login.aspx">Log in</a></div>
  <a class="alt" href="/">&larr; Back to AuditionMusic5</a>
</main>
<script src="js/guard.js?v=872"></script>
<script src="js/tip.js?v=872"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
  const $ = (id) => document.getElementById(id);
  const msg = (t, ok) => { $("msg").textContent = t || ""; $("msg").className = "msg" + (ok ? " ok" : ""); };
  const token = () => (window.turnstile && document.querySelector(".cf-turnstile") && window.turnstile.getResponse()) || "";
  const waitToken = async (ms) => {
    const end = Date.now() + (ms || 8000);
    let t = token();
    while (!t && Date.now() < end) {
      await new Promise((r) => setTimeout(r, 200));
      t = token();
    }
    return t;
  };
  let waitTimer = 0;
  const busy = (b, text) => {
    b.disabled = true;
    b.classList.add("loading");
    b.innerHTML = '<span class="spin"></span>' + (text ? "<span>" + text + "</span>" : "");
  };
  const idle = (b, text) => {
    b.disabled = false;
    b.classList.remove("loading");
    b.textContent = text;
  };

  function countdown(sec) {
    const b = $("otpbtn");
    clearInterval(waitTimer);
    b.classList.remove("loading");
    let n = sec;
    b.disabled = true;
    b.textContent = "Wait " + n + "s";
    waitTimer = setInterval(() => {
      n--;
      if (n <= 0) {
        clearInterval(waitTimer);
        b.disabled = false;
        b.textContent = "Resend Code";
      } else b.textContent = "Wait " + n + "s";
    }, 1000);
  }

  $("otpbtn").addEventListener("click", async () => {
    msg("");
    const u = $("u").value.trim();
    const email = $("e").value.trim();
    if (!u) return msg("Username is required.");
    if (!email) return msg("Email is required.");
    busy($("otpbtn"));
    try {
      const r = await fetch("/api/auth/signup/otp", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ u, email }),
      });
      const j = await r.json();
      if (j.ok) {
        msg("Code sent. Check your inbox.", true);
        countdown(j.wait || 60);
      } else {
        msg(j.error || "Could not send code.");
        idle($("otpbtn"), "Get Code");
      }
    } catch (e) {
      msg("Could not send code. Try again.");
      idle($("otpbtn"), "Get Code");
    }
  });

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    msg("");
    const u = $("u").value.trim();
    const email = $("e").value.trim();
    const otp = $("o").value.replace(/\D/g, "");
    const p = $("p").value;
    if (!u || !email || !otp || !p) return msg("Fill all fields.");
    if (otp.length !== 6) return msg("OTP must be 6 digits.");
    if (p.length < 6) return msg("Password must be at least 6 characters.");
    busy($("createbtn"));
    const tk = await waitToken();
    if (!tk) {
      idle($("createbtn"), "Sign up for free");
      return msg("Complete the verification first, then press Sign up again.");
    }
    try {
      const r = await fetch("/api/auth/signup", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ u, email, otp, p, token: tk }),
      });
      const j = await r.json();
      if (j.ok) { location.href = "/"; return; }
      msg(j.error === "maintenance" ? "Site is under maintenance." : (j.error || "Sign up failed."));
    } catch (err) {
      msg("Sign up failed. Try again.");
    }
    idle($("createbtn"), "Sign up for free");
    if (window.turnstile) window.turnstile.reset();
  });

  $("gbtn").onclick = () => { location.href = "/api/auth/google"; };
</script>
</body>
</html>
