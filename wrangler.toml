name = "auditionmusic5"
main = "js/main.js"
compatibility_date = "2024-01-01"

[assets]
directory = "."
binding = "BINDING_ASSETS"
# Worker must run before assets so maintenance gate + auth can intercept.
run_worker_first = true

# NOTE: all secrets/vars live in the Cloudflare dashboard (Variables and
# Secrets) so the admin panel and the dashboard are the single source:
#   MAINTENANCE, ADMIN_KEY, ADMIN_USER, ADMIN_PASS, SESSION_SECRET,
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, FB_APP_ID, FB_APP_SECRET,
#   GH_TOKEN, GH_REPO, GH_BRANCH, GH_DIR  +  KV binding MT_KV.
# (Cloudflare may ask to "sync" these into wrangler.toml — ignore/dismiss it,
#  this file intentionally keeps [vars] empty; dashboard is the source of truth.)
