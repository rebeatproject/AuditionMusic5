name = "auditionmusic5"
main = "js/MT.js"
compatibility_date = "2024-01-01"
# Keep MAINTENANCE / ADMIN_KEY as set in the Cloudflare dashboard on deploy.
keep_vars = true

[assets]
directory = "."
binding = "BINDING_ASSETS"
# Worker must run before assets so the maintenance gate can intercept "/".
run_worker_first = true

# NOTE: MAINTENANCE + ADMIN_KEY live in the dashboard (Variables and Secrets),
# NOT here. keep_vars=true stops wrangler from wiping them on deploy.
