name = "auditionmusic5"
main = "js/main.js"
compatibility_date = "2024-01-01"

# Non-secret vars WAJIB di sini: Workers Builds (deploy dari git) HANYA baca
# wrangler.toml. Var yang ditambah di dashboard UI TIDAK sampai ke runtime
# (makanya Cloudflare nge-warning "keep deployments in sync").
[vars]
GOOGLE_CLIENT_ID = "483244673286-tfs8p9ove2f9310gnfonqltpuehq4trf.apps.googleusercontent.com"
MAINTENANCE = "1"
GH_REPO = "rebeatproject/AuditionMusic5"
GH_BRANCH = "main"
GH_DIR = "data"

[assets]
directory = "."
binding = "BINDING_ASSETS"
# Worker must run before assets so maintenance gate + auth can intercept.
run_worker_first = true

# R2: asset wasm/ffmpeg (self-host, gak ambil CDN pihak ketiga)
[[r2_buckets]]
bucket_name = "am5-assets"
binding = "AM5_ASSETS"

# KV: saklar Maintenance (key "maintenance") + SLK hasil upload (key "slk:<nama>").
[[kv_namespaces]]
binding = "MT_KV"
id = "59501432e7a1431083676447d99cc25f"

# D1: live chat (visitor <-> admin via Telegram). Dipilih D1 karena KV
# eventual consistent (balasan admin bisa telat ~60 dtk antar-colo).
[[d1_databases]]
binding = "CHAT_DB"
database_name = "am5-chat"
database_id = "a3682fba-0ec8-4951-81b3-b719a4206488"

# Lockout login per username: 10 percobaan / 60 detik (key di main.js: "u:<username>").
# Counter-nya nempel ke username, jadi brute force satu akun mentok walau IP diputar.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# NOTE: SECRETS tetap di Cloudflare dashboard (Settings > Variables and
# Secrets, tipe Secret) — secret kebawa lintas build:
#   ADMIN_KEY, ADMIN_USER, ADMIN_PASS, SESSION_SECRET,
#   GOOGLE_CLIENT_SECRET, FB_APP_ID, FB_APP_SECRET, GH_TOKEN
# Aturan: secret -> dashboard; var non-secret -> [vars] di atas
#   (GOOGLE_CLIENT_ID, MAINTENANCE, GH_REPO, GH_BRANCH, GH_DIR).
