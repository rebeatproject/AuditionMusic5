name = "auditionmusic5"
main = "js/MT.js"
compatibility_date = "2024-01-01"

[assets]
directory = "."
binding = "BINDING_ASSETS"
# Worker must run before assets so the maintenance gate can intercept "/".
run_worker_first = true

[vars]
# Maintenance switch: "1" = maintenance on, "0" = site online.
# Edit here, then push -> GitHub build redeploys automatically.
MAINTENANCE = "1"
# ADMIN_KEY is a SECRET (set in the dashboard), not here.
